name: node-js feature
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      component:
        required: true
        type: string
env:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}
jobs:
  build-nodejs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      - name: read version
        run: |
          ls -l
